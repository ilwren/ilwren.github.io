{{- $account := .Get "account" | default "ilwren" -}}
<section class="github-activity" data-github-account="{{ $account }}" aria-label="GitHub account contribution activity">
  <div class="github-activity-header">
    <div>
      <div class="github-activity-kicker">GITHUB ACCOUNT ACTIVITY</div>
      <h3 class="github-activity-title">账号贡献活动</h3>
    </div>
    <a href="https://github.com/{{ $account }}" target="_blank" rel="noopener noreferrer">@{{ $account }} ↗</a>
  </div>
  <div class="github-activity-summary">
    <strong data-github-contribution-total>加载中</strong>
    <span>近一年贡献</span>
    <span class="github-activity-dot">·</span>
    <span data-github-active-weeks>统计中</span>
  </div>
  <div class="github-activity-scroll" role="img" aria-label="近一年 GitHub 账号贡献活动图表">
    <div class="github-activity-grid" data-github-activity-grid></div>
  </div>
  <div class="github-activity-legend" aria-hidden="true">
    <span>少</span>
    <i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i>
    <span>多</span>
  </div>
  <p class="github-activity-note" data-github-activity-note>数据由 GitHub Actions 构建时获取账号贡献日历。</p>
</section>
