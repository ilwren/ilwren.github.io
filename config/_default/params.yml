# Sponsor
sponsor:
  enable: false
  tip: 
    zh-CN: 请作者喝杯咖啡吧
    zh-TW: 請作者喝杯咖啡吧
    en: Buy me a coffee
    ja: コーヒーを買ってください
    pt-BR: Compre-me um café
  icon:
    url: "../images/taichi.png" # this path is relative to the css/main.css, so it needs to go up one level to reach the images folder
    rotate: true
    mask: true # whether to use the images as a mask
  qr:
    # - name: 支付宝
    #   src: "sponsor/alipay.jpg"
    # - name: 微信
    #   src: "sponsor/wechat.png"

# Share
share:
  # - facebook
  # - twitter
  # - bluesky
  # - linkedin
  # - reddit
  # - weibo
  # - qq
  # - weixin

# show categories card on home page
home_categories:
  enable: false
  content:
    - categories: # string (single-layer category) or array (multi-layer category)
      cover: # empty means random cover
    - categories:
      cover:

########################################
# Experimental features
########################################

# Inject code snippet
# Make sure your code snippet is safeHTML
injector:
  head_begin: # Inject code snippet right after <head>
  head_end: |
    <style>
      /*
       * Site palette: misty teal, warm sand and paper white.
       * This is intentionally injected after Reimu's compiled CSS so the
       * theme submodule can be upgraded without editing it.
       */
      :root {
        --color-default: #2d3b3a;
        --color-background: #f3f0e9;
        --color-code-background: #edf2ef;
        --color-header-background: rgba(250, 248, 242, 0.92);
        --color-footer-background: #e7eee9;
        --color-mobile-nav-background: #faf8f2;
        --color-wrap: #fffdf8;
        --color-sticky: #f7eadc;
        --color-h2-border: #d8e1dc;
        --color-h2-after: #c97955;
        --color-meta-shadow: rgba(48, 111, 105, 0.24);
        --color-hover-shadow: rgba(45, 59, 58, 0.13);
        --color-link: #2f7772;
        --site-header-ink: #254f4c;
        --site-header-soft: #53716c;
      }

      [data-theme="dark"] {
        --color-default: #d7e2dd;
        --color-background: #1c2928;
        --color-code-background: #223331;
        --color-header-background: rgba(28, 41, 40, 0.94);
        --color-footer-background: #172322;
        --color-mobile-nav-background: #223331;
        --color-wrap: #243431;
        --color-sticky: #3a3028;
        --color-h2-border: #3c514d;
        --color-h2-after: #d48b68;
        --color-meta-shadow: rgba(0, 0, 0, 0.28);
        --color-hover-shadow: rgba(0, 0, 0, 0.28);
        --color-link: #9ed1bf;
        --site-header-ink: #dcebe5;
        --site-header-soft: #aecbc0;
        --red-0: #a9d4c2;
        --red-1: #82bfae;
        --red-2: #a8d8c7;
        --red-3: #5b8c80;
        --red-4: rgba(169, 212, 194, 0.28);
        --red-5: rgba(169, 212, 194, 0.16);
        --red-5-5: rgba(169, 212, 194, 0.09);
        --red-6: rgba(169, 212, 194, 0.06);
      }

      /* The header stays image-free until a real banner is selected. */
      #header {
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 32%, rgba(255, 255, 255, 0.72), transparent 30%),
          radial-gradient(circle at 82% 12%, rgba(201, 121, 85, 0.14), transparent 34%),
          linear-gradient(135deg, #dcebe3 0%, #f5eee4 52%, #e6d8ca 100%);
      }

      #header > img[style*="visibility: hidden"] {
        display: none !important;
      }

      [data-theme="dark"] #header {
        background:
          radial-gradient(circle at 18% 32%, rgba(115, 171, 151, 0.16), transparent 30%),
          radial-gradient(circle at 82% 12%, rgba(212, 139, 104, 0.16), transparent 34%),
          linear-gradient(135deg, #243b37 0%, #303331 52%, #40362f 100%);
      }

      #header-outer {
        z-index: 0;
      }

      #logo,
      #subtitle {
        color: var(--site-header-ink) !important;
        text-shadow: none !important;
      }

      #subtitle {
        opacity: 0.86;
      }

      #header-nav {
        background: var(--color-header-background);
        box-shadow: 0 1px 0 rgba(47, 119, 114, 0.12), 0 6px 20px rgba(45, 59, 58, 0.08);
      }

      #header-nav:hover {
        background: var(--color-header-background);
      }

      .post-cover {
        background: linear-gradient(135deg, #dcebe3, #f1e2d5) !important;
      }

      [data-theme="dark"] .post-cover {
        background: linear-gradient(135deg, #294641, #493a32) !important;
      }
    </style>
  body_begin: # Inject code snippet right after <body>
  body_end: # Inject code snippet right before </body>
  sidebar_begin: # Inject code snippet right after <aside>
  sidebar_end: # Inject code snippet right before </aside>

